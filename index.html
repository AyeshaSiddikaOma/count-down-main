
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>It is</h1>

        <div class="countdown">

            <span>
                <b id="y"></b>
                Years
            </span>

            <span>
                <b id="m"></b>
                Months
            </span>

            <span>
                <b id="d"></b>
                Days
            </span>

            <span>
                <b id="h"></b>
                Hours
            </span>

            <span>
                <b id="mi"></b>
                Minutes
            </span>

            <span>
                <b id="s"></b>
                Seconds
            </span>

        </div>

        <h2>left to</h2>

        <div class="date">

            <h2 id="oma"></h2>

            <h2>01</h2>

            <h2 id="ayesha"></h2>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
